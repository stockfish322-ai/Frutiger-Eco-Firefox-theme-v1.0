/* ---------- scenery ---------- */
.sun {
  position: fixed; top: -160px; right: -120px; width: 520px; height: 520px; border-radius: 50%;
  background: radial-gradient(circle, rgba(255,255,255,.95) 0%, rgba(255,247,200,.55) 30%, rgba(255,255,255,0) 68%);
  pointer-events: none;
}

.hill { position: fixed; left: -10%; width: 120%; border-radius: 50% 50% 0 0 / 100% 100% 0 0; pointer-events: none; }
.hill-back  { bottom: -8vh; height: 34vh; background: linear-gradient(180deg, #8fdc6a, #4fb84a); opacity: .9; transform: translateX(-12%); width: 130%; }
.hill-front { bottom: -14vh; height: 32vh; background: linear-gradient(180deg, #6fd04f, var(--leaf-deep)); transform: translateX(8%); }
.hill::after {
  content: ""; position: absolute; inset: 0 0 auto 0; height: 40%;
  border-radius: inherit; background: linear-gradient(180deg, rgba(255,255,255,.35), rgba(255,255,255,0));
}

.bubbles { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }

/* ---------- content ---------- */
.stage {
  position: relative; z-index: 2; height: 100%;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
  padding: 24px 24px 12vh;
}

.clock {
  font-size: clamp(64px, 11vw, 120px); font-weight: 300; letter-spacing: -.02em; line-height: 1;
  text-shadow: 0 2px 0 rgba(11,74,110,.25), 0 6px 24px rgba(11,74,110,.35);
}
.date { font-size: 18px; margin-top: -10px; text-shadow: 0 1px 8px rgba(11,74,110,.45); }

.glass {
  position: relative; overflow: hidden;
  background: linear-gradient(180deg, rgba(255,255,255,.62), rgba(255,255,255,.22));
  border: 1px solid rgba(255,255,255,.85);
  box-shadow: inset 0 1px 0 #fff, inset 0 -8px 18px rgba(80,180,230,.18), 0 10px 32px rgba(11,74,110,.28);
}
.glass::before {
  content: ""; position: absolute; inset: 0 0 52% 0; pointer-events: none;
  background: linear-gradient(180deg, rgba(255,255,255,.65), rgba(255,255,255,.08));
}

.search {
  display: flex; align-items: center; width: min(520px, 92vw); padding: 6px 6px 6px 22px; border-radius: 999px;
}
.search input {
  position: relative; flex: 1; min-width: 0; border: 0; outline: 0; background: transparent;
  font: 400 17px var(--font); color: var(--ink); user-select: text;
}
.search input::placeholder { color: rgba(11,74,110,.6); }
.search:focus-within { box-shadow: inset 0 1px 0 #fff, 0 0 0 3px rgba(255,255,255,.8), 0 10px 32px rgba(11,74,110,.28); }

.go {
  position: relative; width: 44px; height: 44px; border: 0; border-radius: 50%; cursor: pointer;
  background: radial-gradient(circle at 32% 24%, rgba(255,255,255,.95), rgba(255,255,255,0) 42%), linear-gradient(180deg, #8be36a, #2fa23b);
  box-shadow: inset 0 -4px 8px rgba(0,80,0,.35), 0 3px 8px rgba(11,74,110,.35);
}
.go::after {
  content: ""; position: absolute; left: 13px; top: 12px; width: 11px; height: 11px;
  border: 2.5px solid #fff; border-radius: 50%;
}
.go::before {
  content: ""; position: absolute; left: 25px; top: 24px; width: 8px; height: 2.5px; background: #fff;
  border-radius: 2px; transform: rotate(45deg); transform-origin: left center;
}

/* ---------- quick launch ---------- */
.launch { display: flex; gap: 36px; margin-top: 6px; }
.tile { display: flex; flex-direction: column; align-items: center; gap: 10px; text-decoration: none; color: #fff; outline: none; }
.name { font-size: 15px; text-shadow: 0 1px 8px rgba(11,74,110,.6); }

.orb {
  position: relative; display: grid; place-items: center; width: 92px; height: 92px; border-radius: 50%;
  border: 2px solid rgba(255,255,255,.9);
  box-shadow: inset 0 -10px 18px rgba(0,0,0,.22), 0 10px 22px rgba(11,74,110,.4);
  transition: transform .18s ease, box-shadow .18s ease;
}
.orb::after {
  content: ""; position: absolute; top: 4px; left: 12%; width: 76%; height: 48%; border-radius: 50%;
  background: linear-gradient(180deg, rgba(255,255,255,.85), rgba(255,255,255,.05));
}
.orb svg { position: relative; z-index: 1; width: 50px; height: 50px; filter: drop-shadow(0 2px 2px rgba(0,0,0,.25)); }
.orb.red    { background: radial-gradient(circle at 50% 100%, #ff8a7a, #e0261b 60%, #a30f08); }
.orb.orange { background: radial-gradient(circle at 50% 100%, #ffb27a, #ff5a1a 60%, #c23a00); }

.tile:hover .orb, .tile:focus-visible .orb { transform: translateY(-4px) scale(1.04); }
.tile:active .orb { transform: scale(.96); }
.tile:focus-visible .orb { box-shadow: 0 0 0 4px rgba(255,255,255,.9), 0 10px 22px rgba(11,74,110,.4); }

/* ---------- water touch ripple ---------- */
.ripples { position: fixed; inset: 0; z-index: 50; pointer-events: none; overflow: hidden; }

.ring {
  position: absolute; width: 260px; height: 260px; margin: -130px 0 0 -130px; border-radius: 50%;
  border: 2px solid rgba(255,255,255,.75);
  background: radial-gradient(circle, rgba(255,255,255,0) 52%, rgba(255,255,255,.28) 66%, rgba(255,255,255,0) 72%);
  box-shadow: inset 0 0 8px rgba(255,255,255,.6);
  transform: scale(.04); opacity: 0;
  will-change: transform, opacity;
  animation: ripple 1.25s cubic-bezier(.2,.6,.3,1) forwards;
}
.ring.r2 { animation-delay: .12s; width: 200px; height: 200px; margin: -100px 0 0 -100px; }
.ring.r3 { animation-delay: .24s; width: 140px; height: 140px; margin: -70px 0 0 -70px; }
@keyframes ripple {
  0%   { transform: scale(.04); opacity: 0; }
  12%  { opacity: 1; }
  100% { transform: scale(1);   opacity: 0; }
}

.drop {
  position: absolute; width: 26px; height: 26px; margin: -13px 0 0 -13px; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #fff, rgba(255,255,255,.35) 45%, rgba(130,210,255,.2));
  will-change: transform, opacity;
  animation: drop .55s ease-out forwards;
}
@keyframes drop { from { transform: scale(1.3); opacity: 1; } to { transform: scale(.2); opacity: 0; } }

@media (prefers-reduced-motion: reduce) {
  .bubble { animation: none; opacity: .6; }
  .ring { animation-duration: .5s; }
}
@media (max-width: 480px) { .launch { gap: 22px; } .orb { width: 78px; height: 78px; } }


/* wallpaper replaces the painted scenery */
.sun, .hill { display: none; }
body::before {
  content: ""; position: fixed; inset: 0; pointer-events: none;
  background: linear-gradient(180deg, rgba(0,40,100,.18), rgba(0,40,100,0) 45%);
}

.mute {
  position: fixed; right: 18px; bottom: 18px; z-index: 60; width: 44px; height: 44px; border-radius: 50%;
  display: grid; place-items: center; font-size: 18px; cursor: pointer; padding: 0; color: #0b4a6e;
}
.mute:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }

/* ---------- settings ---------- */
.gear {
  position: fixed; right: 72px; bottom: 18px; z-index: 60; width: 44px; height: 44px; border-radius: 50%;
  display: grid; place-items: center; font-size: 18px; cursor: pointer; padding: 0; color: #0b4a6e;
}
.gear:focus-visible, .btn:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
.panel {
  position: fixed; right: 18px; bottom: 74px; z-index: 70; width: min(300px, calc(100vw - 36px));
  padding: 16px 18px 14px; border-radius: 22px; color: #0b4a6e; user-select: text;
}
.panel[hidden] { display: none; }
.panel > * { position: relative; }
.panel h2 { margin: 0 0 10px; font-size: 18px; font-weight: 600; }
.panel p { margin: 2px 0 12px; font-size: 14px; opacity: .8; }
.panel .note { min-height: 18px; margin: 10px 0 0; font-size: 13px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.btn {
  border: 1px solid rgba(255,255,255,.85); border-radius: 999px; padding: 9px 16px; cursor: pointer;
  font: 500 14px var(--font); color: #fff; text-shadow: 0 1px 2px rgba(0,60,0,.45);
  background: linear-gradient(180deg, #8be36a, #2fa23b);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.7), 0 3px 8px rgba(11,74,110,.3);
}
.btn.ghost { color: #0b4a6e; text-shadow: none; background: linear-gradient(180deg, rgba(255,255,255,.9), rgba(255,255,255,.45)); }
.btn:active { transform: translateY(1px); }

/* gear: small image inside a glass bubble, like the sound button */
.gear { width: 44px; height: 44px; padding: 0; border-radius: 50%; display: grid; place-items: center; }
.gear img {
  position: relative; width: 24px; height: 24px; display: block; pointer-events: none;
  filter: drop-shadow(0 1px 2px rgba(11,74,110,.4)); transition: transform .25s ease;
}
.gear:hover img { transform: rotate(30deg); }
.gear:active img { transform: rotate(60deg) scale(.95); }
@media (prefers-reduced-motion: reduce) { .gear img { transition: none; } }

.row {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding-bottom: 12px; margin-bottom: 12px; border-bottom: 1px solid rgba(11,74,110,.15);
}
.row span { font-weight: bold; }
.switch {
  position: relative; flex: none; width: 48px; height: 28px; padding: 0; border-radius: 999px; cursor: pointer;
  border: 1px solid rgba(255,255,255,.85); transition: background .2s;
  background: linear-gradient(180deg, #b9c9d4, #dbe6ee);
  box-shadow: inset 0 2px 4px rgba(11,74,110,.3);
}
.switch::after {
  content: ""; position: absolute; top: 2px; left: 2px; width: 22px; height: 22px; border-radius: 50%;
  background: radial-gradient(circle at 35% 28%, #fff, #e8f2f8 60%, #c8d8e2);
  box-shadow: 0 2px 4px rgba(11,74,110,.4); transition: transform .2s;
}
.switch[aria-checked="true"] { background: linear-gradient(180deg, #8be36a, #2fa23b); }
.switch[aria-checked="true"]::after { transform: translateX(20px); }
.switch:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { .switch, .switch::after { transition: none; } }

/* ---------- custom quick launch ---------- */
.launch { flex-wrap: wrap; justify-content: center; gap: 22px 36px; max-width: min(760px, 94vw); }
.launch.many .orb { width: 74px; height: 74px; }
.launch.many .orb svg { width: 40px; height: 40px; }
.launch.many .letter { font-size: 30px; }
.letter {
  position: relative; z-index: 1; font: 600 38px var(--font); color: #fff; line-height: 1;
  text-shadow: 0 2px 2px rgba(0,50,100,.45);
}
.orb.c0 { background: radial-gradient(circle at 50% 100%, #9bf0ff, #1fa0e8 60%, #0a5fb8); }
.orb.c1 { background: radial-gradient(circle at 50% 100%, #c9ff9a, #4fcf2e 60%, #2a8f1f); }
.orb.c2 { background: radial-gradient(circle at 50% 100%, #aaf5e2, #22b89c 60%, #0a7a68); }
.orb.c3 { background: radial-gradient(circle at 50% 100%, #b9dcff, #3d90ea 60%, #1b58bb); }
.orb.c4 { background: radial-gradient(circle at 50% 100%, #ffe39a, #f5a623 60%, #b36b00); }
.orb.c5 { background: radial-gradient(circle at 50% 100%, #f4ff9a, #c8dc2a 60%, #8a9a10); }

.panel { max-height: calc(100vh - 100px); overflow-y: auto; }
.section { margin-top: 12px; padding-top: 12px; border-top: 1px solid rgba(11,74,110,.15); }
.linkform { display: grid; gap: 8px; }
.linkform input {
  width: 100%; padding: 9px 14px; border-radius: 999px; border: 1px solid rgba(255,255,255,.9);
  background: rgba(255,255,255,.78); color: #0b4a6e; font: 14px var(--font); outline: none;
  box-shadow: inset 0 2px 4px rgba(11,74,110,.2); user-select: text;
}
.linkform input:focus { box-shadow: inset 0 2px 4px rgba(11,74,110,.2), 0 0 0 3px rgba(139,227,106,.8); }
.linkform .btn { justify-self: start; }
.mylinks { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 6px; max-height: 150px; overflow-y: auto; }
.mylinks li {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 4px 6px 4px 14px; border-radius: 999px; font-size: 13px; background: rgba(255,255,255,.55);
}
.mylinks li span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.x {
  flex: none; width: 24px; height: 24px; padding: 0; border-radius: 50%; cursor: pointer;
  border: 1px solid #fff; color: #fff; font: 700 15px/1 var(--font);
  background: linear-gradient(180deg, #ffb7a8, #e0432b);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.7), 0 1px 3px rgba(11,74,110,.35);
}
.x:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }

/* readability: more solid settings panel, stronger tile labels */
.panel { background: linear-gradient(180deg, rgba(255,255,255,.9), rgba(232,247,255,.84)); }
.name { font-weight: 600; text-shadow: 0 1px 3px rgba(0,40,90,.9), 0 0 10px rgba(0,40,90,.55); }

/* ---------- real website icons ---------- */
.orb .favicon {
  position: relative; z-index: 1; display: none; width: 54px; height: 54px; border-radius: 12px; object-fit: contain;
  filter: drop-shadow(0 1px 2px rgba(0,40,90,.35));
}
.orb.has-icon { background: radial-gradient(circle at 50% 110%, #bfeaff, #ffffff 62%, #f2fbff) !important; }
.orb.has-icon .favicon { display: block; }
.orb.has-icon .letter { display: none; }
.launch.many .favicon { width: 44px; height: 44px; }
.row.last { border-bottom: 0; margin-bottom: 0; padding-bottom: 0; margin-top: 10px; }
.panel .hint { margin: 4px 0 0; font-size: 12px; opacity: .7; }

/* ---------- bubbles that pop up where you press ---------- */
.pop {
  position: absolute; border-radius: 50%; pointer-events: none; will-change: transform, opacity;
  background:
    radial-gradient(circle at 30% 28%, rgba(255,255,255,.95) 0 10%, rgba(255,255,255,0) 28%),
    radial-gradient(circle at 50% 55%, rgba(255,255,255,.05) 55%, rgba(255,255,255,.5) 100%);
  border: 1px solid rgba(255,255,255,.75);
  transform: translate3d(0, 0, 0) scale(.2); opacity: 0;
  animation: bubble-pop var(--dur, 1.8s) ease-out var(--delay, 0s) forwards;
}
@keyframes bubble-pop {
  0%   { transform: translate3d(0, 0, 0) scale(.2); opacity: 0; }
  12%  { transform: translate3d(calc(var(--dx) * .1), calc(var(--dy) * .1), 0) scale(1); opacity: 1; }
  70%  { transform: translate3d(calc(var(--dx) * .8), calc(var(--dy) * .8), 0) scale(1); opacity: .95; }
  88%  { transform: translate3d(var(--dx), var(--dy), 0) scale(1.15); opacity: .8; }
  100% { transform: translate3d(var(--dx), var(--dy), 0) scale(1.5); opacity: 0; }
}

/* ---------- floating bubbles (transform + opacity only, so they stay smooth) ---------- */
.bubbles { contain: layout paint; }
.bubble {
  position: absolute; bottom: -80px; will-change: transform, opacity;
  animation: rise linear infinite;
}
.bubble .b {
  display: block; width: 100%; height: 100%; border-radius: 50%;
  background:
    radial-gradient(ellipse closest-side, rgba(255,255,255,.95), rgba(255,255,255,0)) 22% 16% / 32% 22% no-repeat,
    radial-gradient(circle closest-side, rgba(255,255,255,.06) 0, rgba(255,255,255,.14) 62%, rgba(255,255,255,.65) 92%, rgba(255,255,255,0) 100%);
  animation: sway ease-in-out infinite alternate;
}
/* each bubble rises to its own height, then pops (grows a little and fades) */
@keyframes rise {
  0%   { transform: translate3d(0, 0, 0) scale(.7); opacity: 0; }
  8%   { transform: translate3d(0, calc(var(--rise, 80) * -.08vh), 0) scale(1); opacity: 1; }
  90%  { transform: translate3d(0, calc(var(--rise, 80) * -.9vh), 0) scale(1); opacity: 1; }
  100% { transform: translate3d(0, calc(var(--rise, 80) * -1vh), 0) scale(1.3); opacity: 0; }
}
@keyframes sway {
  from { transform: translate3d(calc(var(--drift, 16px) * -1), 0, 0); }
  to   { transform: translate3d(var(--drift, 16px), 0, 0); }
}
.bubbles.paused .bubble, .bubbles.paused .b { animation-play-state: paused; }
@media (prefers-reduced-motion: reduce) { .bubble .b { animation: none; } }
</style>

    <p>Pick any image from your computer.</p>
    <div class="actions">
      <button class="btn" id="pick" type="button">Choose image</button>
      <button class="btn ghost" id="reset" type="button">Use default</button>
    </div>
    <p class="note" id="note" role="status"></p>
    <div class="section">
      <strong>Add a quick launch</strong>
      <p>Paste a link and it shows up on your homepage.</p>
      <form id="linkForm" class="linkform" autocomplete="off">
        <input id="linkUrl" type="text" inputmode="url" placeholder="example.com" aria-label="Website link" required>
        <input id="linkName" type="text" placeholder="Name (optional)" aria-label="Name" maxlength="20">
        <button class="btn" type="submit">Add</button>
      </form>
      <ul class="mylinks" id="myLinks"></ul>
      <p class="note" id="linkNote" role="status"></p>
      <div class="row last">
        <span id="iconsLabel">Website icons</span>
        <button class="switch" id="icons" type="button" role="switch" aria-checked="true" aria-labelledby="iconsLabel"></button>
      </div>
      <p class="hint">Fetched from an online icon service. Turn off to keep this page fully offline.</p>
    </div>
    <input type="file" id="file" accept="image/*" hidden>
  </section>

  <button class="mute glass" id="mute" type="button"></button>

  <div class="ripples" id="ripples" aria-hidden="true"></div>
  <script>
// Clock + date
const clock = document.getElementById("clock");
const dateEl = document.getElementById("date");
function tick() {
  const now = new Date();
  clock.textContent = now.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  dateEl.textContent = now.toLocaleDateString([], { weekday: "long", month: "long", day: "numeric" });
}
tick();
setInterval(tick, 1000);

// Floating bubbles: a handful of cheap elements (transform/opacity animations only)
const bubbles = document.getElementById("bubbles");
const BUBBLE_COUNT = 16;
let bubblesOn = true;
try { bubblesOn = localStorage.getItem("eco-bubbles") !== "0"; } catch (e) {}
const bubblesBtn = document.getElementById("bubblesToggle");

function renderBubbles() {
  bubbles.textContent = "";
  if (!bubblesOn) return;                      // off = no elements at all, zero cost
  const frag = document.createDocumentFragment();
  for (let i = 0; i < BUBBLE_COUNT; i++) {
    const b = document.createElement("span");
    const size = 16 + Math.random() * 48;
    b.className = "bubble";
    b.style.cssText =
      `width:${size}px;height:${size}px;left:${2 + Math.random() * 94}%;` +
      `animation-duration:${14 + Math.random() * 14}s;animation-delay:${-Math.random() * 28}s;` +
      `--rise:${50 + Math.random() * 55};`;
    const inner = document.createElement("span");
    inner.className = "b";
    inner.style.cssText =
      `--drift:${8 + Math.random() * 26}px;` +
      `animation-duration:${4 + Math.random() * 4}s;animation-delay:${-Math.random() * 6}s;`;
    b.appendChild(inner);
    frag.appendChild(b);
  }
  bubbles.appendChild(frag);
}
function showBubblesSwitch() { bubblesBtn.setAttribute("aria-checked", String(bubblesOn)); }
bubblesBtn.addEventListener("click", () => {
  bubblesOn = !bubblesOn;
  try { localStorage.setItem("eco-bubbles", bubblesOn ? "1" : "0"); } catch (e) {}
  showBubblesSwitch();
  renderBubbles();
});
// don't animate while the tab is hidden
document.addEventListener("visibilitychange", () => bubbles.classList.toggle("paused", document.hidden));
showBubblesSwitch();
renderBubbles();

// Water touch ripple on every press
const layer = document.getElementById("ripples");
// Water drop sound (synthesised, no audio file needed)
let audio = null, master = null, muted = false;
try { muted = localStorage.getItem("eco-muted") === "1"; } catch (e) {}

function bloop(t, f0, f1, peak, dur) {
  const o = audio.createOscillator(), g = audio.createGain();
  o.type = "sine";
  o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(f1, t + dur * 0.45);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(peak, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(master);
  o.start(t);
  o.stop(t + dur + 0.05);
}

function playDrop() {
  if (muted) return;
  if (!audio) {
    audio = new (window.AudioContext || window.webkitAudioContext)();
    master = audio.createGain();
    master.gain.value = 0.5;
    master.connect(audio.destination);
  }
  if (audio.state === "suspended") audio.resume();
  const t = audio.currentTime;
  const r = 0.9 + Math.random() * 0.25;           // slight pitch variety
  bloop(t, 340 * r, 980 * r, 0.32, 0.24);         // the "bloop"
  bloop(t + 0.09, 230 * r, 560 * r, 0.16, 0.34);  // softer echo from the rings
  // tiny splash of filtered noise
  const len = Math.floor(audio.sampleRate * 0.09);
  const buf = audio.createBuffer(1, len, audio.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const n = audio.createBufferSource(), f = audio.createBiquadFilter(), g = audio.createGain();
  n.buffer = buf;
  f.type = "bandpass"; f.frequency.value = 2400; f.Q.value = 0.9;
  g.gain.value = 0.12;
  n.connect(f).connect(g).connect(master);
  n.start(t);
}

// Mute button
const muteBtn = document.getElementById("mute");
function showMute() {
  muteBtn.textContent = muted ? "\u{1F507}" : "\u{1F50A}";
  muteBtn.setAttribute("aria-label", muted ? "Unmute water sound" : "Mute water sound");
}
muteBtn.addEventListener("pointerdown", (e) => e.stopPropagation());
muteBtn.addEventListener("click", () => {
  muted = !muted;
  try { localStorage.setItem("eco-muted", muted ? "1" : "0"); } catch (e) {}
  showMute();
});
showMute();

// Bubbles that appear where you press, float up and pop
const reduceMotion = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
function spawnBubbles(x, y) {
  if (reduceMotion || layer.querySelectorAll(".pop").length > 30) return;   // keep it light
  const n = 4 + Math.floor(Math.random() * 3);
  for (let i = 0; i < n; i++) {
    const b = document.createElement("span");
    const size = 10 + Math.random() * 26;
    b.className = "pop";
    b.style.cssText =
      `left:${x - size / 2 + (Math.random() - 0.5) * 36}px;top:${y - size / 2 + (Math.random() - 0.5) * 24}px;` +
      `width:${size}px;height:${size}px;` +
      `--dx:${(Math.random() - 0.5) * 90}px;--dy:${-(110 + Math.random() * 170)}px;` +
      `--dur:${1.4 + Math.random() * 1}s;--delay:${Math.random() * 0.22}s;`;
    b.addEventListener("animationend", () => b.remove());
    layer.appendChild(b);
  }
}

function ripple(x, y) {
  if (!waterOn) return;
  playDrop();
  spawnBubbles(x, y);
  const parts = ["ring", "ring r2", "ring r3", "drop"].map((cls) => {
    const el = document.createElement("span");
    el.className = cls;
    el.style.left = x + "px";
    el.style.top = y + "px";
    layer.appendChild(el);
    return el;
  });
  setTimeout(() => parts.forEach((p) => p.remove()), 1800);
}
document.addEventListener("pointerdown", (e) => ripple(e.clientX, e.clientY));

// Let the ripple play before leaving for a quick-launch site
document.getElementById("launch").addEventListener("click", (e) => {
  const a = e.target.closest(".tile");
  if (!a || !waterOn || e.ctrlKey || e.metaKey || e.shiftKey || e.button !== 0) return;
  e.preventDefault();
  if (e.detail === 0) ripple(innerWidth / 2, innerHeight / 2); // keyboard activation
  setTimeout(() => (location.href = a.href), 350);
});


// ---------- Settings: change the wallpaper ----------
const gear = document.getElementById("gear");
const panel = document.getElementById("panel");
const fileInput = document.getElementById("file");
const note = document.getElementById("note");
let wallpaperURL = null;

function setPanel(open) {
  panel.hidden = !open;
  gear.setAttribute("aria-expanded", String(open));
}
gear.addEventListener("click", () => setPanel(panel.hidden));
document.addEventListener("keydown", (e) => { if (e.key === "Escape") setPanel(false); });
document.addEventListener("click", (e) => {
  if (!panel.hidden && !panel.contains(e.target) && !gear.contains(e.target)) setPanel(false);
});

function openDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open("eco-home", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("kv");
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function dbDo(mode, fn) {
  const db = await openDB();
  return new Promise((res, rej) => {
    const q = fn(db.transaction("kv", mode).objectStore("kv"));
    q.onsuccess = () => res(q.result);
    q.onerror = () => rej(q.error);
  });
}

function showWallpaper(blob) {
  if (wallpaperURL) URL.revokeObjectURL(wallpaperURL);
  if (!blob) {
    wallpaperURL = null;
    document.body.style.backgroundImage = "";
    document.body.style.backgroundPosition = "";
    return;
  }
  wallpaperURL = URL.createObjectURL(blob);
  document.body.style.backgroundImage = `url("${wallpaperURL}")`;
  document.body.style.backgroundPosition = "center";
}

// Shrink big photos so they stay fast and fit in storage
async function shrink(file) {
  const bmp = await createImageBitmap(file);
  const s = Math.min(1, 2200 / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas");
  c.width = Math.round(bmp.width * s);
  c.height = Math.round(bmp.height * s);
  const g = c.getContext("2d");
  g.fillStyle = "#fff";
  g.fillRect(0, 0, c.width, c.height);
  g.drawImage(bmp, 0, 0, c.width, c.height);
  return new Promise((res) => c.toBlob(res, "image/jpeg", 0.88));
}

document.getElementById("pick").addEventListener("click", () => fileInput.click());

fileInput.addEventListener("change", async () => {
  const file = fileInput.files[0];
  fileInput.value = "";
  if (!file) return;
  note.textContent = "Loading...";
  let blob;
  try {
    blob = await shrink(file);
  } catch (e) {
    note.textContent = "That file couldn't be read as an image.";
    return;
  }
  showWallpaper(blob);
  try {
    await dbDo("readwrite", (s) => s.put(blob, "wallpaper"));
    note.textContent = "Wallpaper changed and saved.";
  } catch (e) {
    note.textContent = "Wallpaper changed, but it couldn't be saved for next time.";
  }
});

document.getElementById("reset").addEventListener("click", async () => {
  showWallpaper(null);
  try { await dbDo("readwrite", (s) => s.delete("wallpaper")); } catch (e) {}
  note.textContent = "Default wallpaper restored.";
});

dbDo("readonly", (s) => s.get("wallpaper")).then((b) => b && showWallpaper(b)).catch(() => {});

// ---------- Settings: water touch effect on/off (on by default) ----------
let waterOn = true;
try { waterOn = localStorage.getItem("eco-water") !== "0"; } catch (e) {}
const waterBtn = document.getElementById("water");
function showWater() { waterBtn.setAttribute("aria-checked", String(waterOn)); }
waterBtn.addEventListener("click", () => {
  waterOn = !waterOn;
  try { localStorage.setItem("eco-water", waterOn ? "1" : "0"); } catch (e) {}
  showWater();
  if (waterOn) {
    const r = waterBtn.getBoundingClientRect();
    ripple(r.left + r.width / 2, r.top + r.height / 2); // little preview when turned on
  }
});
showWater();

// ---------- Settings: add your own quick launch links ----------
const launch = document.getElementById("launch");
const linkForm = document.getElementById("linkForm");
const linkUrl = document.getElementById("linkUrl");
const linkName = document.getElementById("linkName");
const myLinks = document.getElementById("myLinks");
const linkNote = document.getElementById("linkNote");
const MAX_LINKS = 8;

function isWebUrl(text) {
  try { const u = new URL(text); return u.protocol === "http:" || u.protocol === "https:"; }
  catch (e) { return false; }
}

let links = [];
try { links = JSON.parse(localStorage.getItem("eco-links") || "[]"); } catch (e) { links = []; }
if (!Array.isArray(links)) links = [];
links = links
  .filter((l) => l && typeof l.url === "string" && isWebUrl(l.url))
  .map((l) => ({ url: l.url, name: String(l.name || "").slice(0, 20) }))
  .slice(0, MAX_LINKS);

function saveLinks() {
  try { localStorage.setItem("eco-links", JSON.stringify(links)); return true; }
  catch (e) { return false; }
}

// Accepts "example.com" or a full link; only http/https are allowed
function normalizeUrl(text) {
  let t = text.trim();
  if (!t || /\s/.test(t)) return null;
  if (!/^[a-z][a-z0-9+.-]*:\/\//i.test(t)) t = "https://" + t;
  let u;
  try { u = new URL(t); } catch (e) { return null; }
  if (u.protocol !== "http:" && u.protocol !== "https:") return null;
  if (!u.hostname.includes(".") && u.hostname !== "localhost") return null;
  return u;
}

function prettyName(host) {
  const first = host.replace(/^www\./, "").split(".")[0];
  return first.charAt(0).toUpperCase() + first.slice(1);
}

function colourClass(host) {
  let h = 0;
  for (const ch of host) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return "c" + (h % 6);
}

function renderLinks() {
  launch.querySelectorAll(".tile.custom").forEach((n) => n.remove());
  myLinks.textContent = "";
  links.forEach((l, i) => {
    const host = new URL(l.url).hostname.replace(/^www\./, "");
    const name = l.name || prettyName(host);

    const a = document.createElement("a");
    a.className = "tile custom";
    a.href = l.url;
    const orb = document.createElement("span");
    orb.className = "orb " + colourClass(host);
    const letter = document.createElement("span");
    letter.className = "letter";
    letter.textContent = name.charAt(0).toUpperCase();
    orb.appendChild(letter);
    if (iconsOn && canFetchIcon(host)) {
      const img = document.createElement("img");
      img.className = "favicon";
      img.alt = "";
      img.decoding = "async";
      img.referrerPolicy = "no-referrer";
      img.addEventListener("load", () => orb.classList.add("has-icon"));
      img.addEventListener("error", () => img.remove());   // keep the letter if it fails
      img.src = "https://www.google.com/s2/favicons?domain=" + encodeURIComponent(host) + "&sz=128";
      orb.appendChild(img);
    }
    const label = document.createElement("span");
    label.className = "name";
    label.textContent = name;
    a.append(orb, label);
    launch.appendChild(a);

    const li = document.createElement("li");
    const text = document.createElement("span");
    text.textContent = name + " \u2013 " + host;
    const x = document.createElement("button");
    x.type = "button";
    x.className = "x";
    x.textContent = "\u00d7";
    x.setAttribute("aria-label", "Remove " + name);
    x.addEventListener("click", () => {
      links.splice(i, 1);
      saveLinks();
      renderLinks();
      linkNote.textContent = name + " removed.";
    });
    li.append(text, x);
    myLinks.appendChild(li);
  });
  launch.classList.toggle("many", launch.children.length > 4);
}

linkForm.addEventListener("submit", (e) => {
  e.preventDefault();
  if (links.length >= MAX_LINKS) {
    linkNote.textContent = "You can add up to " + MAX_LINKS + " links. Remove one first.";
    return;
  }
  const u = normalizeUrl(linkUrl.value);
  if (!u) {
    linkNote.textContent = "That doesn't look like a web link. Try something like example.com";
    return;
  }
  if (links.some((l) => l.url === u.href)) {
    linkNote.textContent = "That link is already on your homepage.";
    return;
  }
  const name = (linkName.value.trim() || prettyName(u.hostname)).slice(0, 20);
  links.push({ url: u.href, name });
  const saved = saveLinks();
  renderLinks();
  linkForm.reset();
  linkNote.textContent = saved ? name + " added." : name + " added, but it couldn't be saved for next time.";
});

// Website icons on/off (on by default) - never sent for local or private addresses
let iconsOn = true;
try { iconsOn = localStorage.getItem("eco-icons") !== "0"; } catch (e) {}
const iconsBtn = document.getElementById("icons");
function showIcons() { iconsBtn.setAttribute("aria-checked", String(iconsOn)); }
function canFetchIcon(host) {
  if (!host.includes(".") || host.includes(":")) return false;          // localhost, IPv6
  if (/^\d{1,3}(\.\d{1,3}){3}$/.test(host)) return false;               // IPv4
  return !/\.(local|lan|internal|home\.arpa|localhost)$/i.test(host);
}
iconsBtn.addEventListener("click", () => {
  iconsOn = !iconsOn;
  try { localStorage.setItem("eco-icons", iconsOn ? "1" : "0"); } catch (e) {}
  showIcons();
  renderLinks();
});
showIcons();

renderLinks();
</script>
</body>
</html>
